<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 683" width="350" height="683" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Prompt:wght@400;500;600;700&amp;display=swap');
      text {
        font-family: 'Prompt', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
    <!-- Filter for Sidebar Drop Shadow -->
    <filter id="sidebar-shadow" x="-4" y="-2" width="358" height="691" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.05" />
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- ========================================== -->
  <!-- 1. SIDEBAR CONTAINER FRAME                 -->
  <!-- ========================================== -->
  <g id="Scope-Hierarchy-Sidebar" filter="url(#sidebar-shadow)">
    <rect width="350" height="683" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  </g>

  <!-- ========================================== -->
  <!-- 2. HEADER: TITLE & COLLAPSE ICON          -->
  <!-- ========================================== -->
  <g id="Header-Bar">
    <text x="16" y="28" font-size="11" font-weight="700" fill="#64748B" letter-spacing="0.5">SCOPE HIERARCHY</text>
    <!-- Collapse Icon (<) -->
    <g id="Button-Collapse" transform="translate(320, 16)" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M5 2L1 6l4 4"/>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- 3. SEARCH PILL INPUT                       -->
  <!-- ========================================== -->
  <g id="Search-Bar" transform="translate(14, 44)">
    <rect width="322" height="34" rx="17" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <!-- Search Magnifying Glass Icon -->
    <g transform="translate(12, 9)" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <circle cx="5.5" cy="5.5" r="4.5"/>
      <line x1="9" y1="9" x2="13" y2="13"/>
    </g>
    <text x="36" y="22" font-size="12" font-weight="400" fill="#94A3B8">Filter brand / branch...</text>
  </g>

  <!-- ========================================== -->
  <!-- 4. ROOT BUTTON: ALL ORGANIZATIONS (ACTIVE) -->
  <!-- ========================================== -->
  <g id="Button-AllOrganizations" transform="translate(14, 90)">
    <rect width="322" height="36" rx="18" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <!-- Store / Org Outline Icon -->
    <g transform="translate(12, 9)" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M1.5 6l6-4.5 6 4.5v7a1.5 1.5 0 0 1-1.5 1.5h-9a1.5 1.5 0 0 1-1.5-1.5V6z"/>
    </g>
    <text x="38" y="23" font-size="13" font-weight="700" fill="#2563EB">All Organizations</text>
  </g>

  <!-- Divider Line -->
  <line x1="0" y1="138" x2="350" y2="138" stroke="#F1F5F9" stroke-width="1"/>

  <!-- ========================================== -->
  <!-- 5. TREE NAVIGATION LIST                    -->
  <!-- ========================================== -->
  <g id="Tree-Navigation-List" transform="translate(14, 150)">

    <!-- ======================================== -->
    <!-- BRAND 1: ARIGATO (EXPANDED)              -->
    <!-- ======================================== -->
    <g id="Node-Brand-Arigato">
      <!-- Chevron Down (v) -->
      <path d="M6 10l3.5 3.5 3.5-3.5" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      
      <!-- Circle Avatar 'A' -->
      <g transform="translate(18, 0)">
        <circle cx="11" cy="12" r="10.5" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
        <text x="11" y="16.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2563EB">A</text>
      </g>
      
      <!-- Brand Name -->
      <text x="48" y="16.5" font-size="13.5" font-weight="700" fill="#0F172A">Arigato</text>
    </g>

    <!-- Indent Guide Line 1: Arigato Children -->
    <line x1="28" y1="32" x2="28" y2="285" stroke="#E2E8F0" stroke-width="1"/>

    <!-- ======================================== -->
    <!-- REGION 1: ภาคกลาง (EXPANDED)             -->
    <!-- ======================================== -->
    <g id="Node-Region-Central" transform="translate(36, 32)">
      <!-- Chevron Down (v) -->
      <path d="M2 9l3 3 3-3" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="16" y="13" font-size="12.5" font-weight="600" fill="#334155">ภาคกลาง</text>
    </g>

    <!-- Indent Guide Line 2: ภาคกลาง Children -->
    <line x1="50" y1="62" x2="50" y2="200" stroke="#E2E8F0" stroke-width="1"/>

    <!-- ======================================== -->
    <!-- PROVINCE 1: กรุงเทพมหานคร (EXPANDED)      -->
    <!-- ======================================== -->
    <g id="Node-Province-Bangkok" transform="translate(58, 62)">
      <!-- Squircle Toggle Button with Chevron Down -->
      <rect width="18" height="18" rx="5" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.6"/>
      <path d="M6 8l3 3 3-3" stroke="#0F172A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="26" y="14" font-size="12.5" font-weight="600" fill="#334155">กรุงเทพมหานคร</text>
    </g>

    <!-- Indent Guide Line 3: Bangkok Branches -->
    <line x1="72" y1="92" x2="72" y2="152" stroke="#E2E8F0" stroke-width="1"/>

    <!-- BRANCHES IN BANGKOK (CHECKBOX MULTI-SELECT) -->
    <g id="Node-Branch-1" transform="translate(86, 92)">
      <rect width="13" height="13" rx="3.5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/>
      <path d="M3.5 6.5l2 2 4-4" stroke="#2563EB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="20" y="10.5" font-size="12" font-weight="500" fill="#1E293B">Arigato Coffee สาขา ซี...</text>
    </g>
    <g id="Node-Branch-2" transform="translate(86, 122)">
      <rect width="13" height="13" rx="3.5" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.2"/>
      <path d="M3.5 6.5l2 2 4-4" stroke="#2563EB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="20" y="10.5" font-size="12" font-weight="500" fill="#1E293B">Arigato สาขา สามย่าน มิ...</text>
    </g>

    <!-- ======================================== -->
    <!-- PROVINCE 2: นนทบุรี (COLLAPSED)          -->
    <!-- ======================================== -->
    <g id="Node-Province-Nonthaburi" transform="translate(58, 154)">
      <!-- Chevron Right (>) -->
      <path d="M8 5l3 3-3 3" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="24" y="13" font-size="12.5" font-weight="500" fill="#334155">นนทบุรี</text>
    </g>

    <!-- ======================================== -->
    <!-- REGION 2: ภาคเหนือ (COLLAPSED)           -->
    <!-- ======================================== -->
    <g id="Node-Region-North" transform="translate(36, 198)">
      <!-- Chevron Right (>) -->
      <path d="M4 5l3 3-3 3" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="16" y="13" font-size="12.5" font-weight="500" fill="#334155">ภาคเหนือ</text>
    </g>

    <!-- ======================================== -->
    <!-- REGION 3: ภาคตะวันออก (COLLAPSED)        -->
    <!-- ======================================== -->
    <g id="Node-Region-East" transform="translate(36, 238)">
      <!-- Chevron Right (>) -->
      <path d="M4 5l3 3-3 3" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="16" y="13" font-size="12.5" font-weight="500" fill="#334155">ภาคตะวันออก</text>
    </g>

    <!-- ======================================== -->
    <!-- BRAND 2: AUNTIE ANNE'S (COLLAPSED)       -->
    <!-- ======================================== -->
    <g id="Node-Brand-AuntieAnnes" transform="translate(0, 280)">
      <!-- Chevron Right (>) -->
      <path d="M8 7l4 4-4 4" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <!-- Circle Avatar 'A' -->
      <g transform="translate(18, 0)">
        <circle cx="11" cy="11" r="10.5" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
        <text x="11" y="15.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2563EB">A</text>
      </g>
      <text x="48" y="16" font-size="13.5" font-weight="700" fill="#0F172A">Auntie Anne's</text>
    </g>

    <!-- ======================================== -->
    <!-- BRAND 3: KFC (COLLAPSED)                 -->
    <!-- ======================================== -->
    <g id="Node-Brand-KFC" transform="translate(0, 320)">
      <!-- Chevron Right (>) -->
      <path d="M8 7l4 4-4 4" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <!-- Circle Avatar 'K' -->
      <g transform="translate(18, 0)">
        <circle cx="11" cy="11" r="10.5" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
        <text x="11" y="15.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2563EB">K</text>
      </g>
      <text x="48" y="16" font-size="13.5" font-weight="700" fill="#0F172A">KFC</text>
    </g>

    <!-- ======================================== -->
    <!-- BRAND 4: MISTER DONUT (COLLAPSED)        -->
    <!-- ======================================== -->
    <g id="Node-Brand-MisterDonut" transform="translate(0, 360)">
      <!-- Chevron Right (>) -->
      <path d="M8 7l4 4-4 4" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <!-- Circle Avatar 'M' -->
      <g transform="translate(18, 0)">
        <circle cx="11" cy="11" r="10.5" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
        <text x="11" y="15.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2563EB">M</text>
      </g>
      <text x="48" y="16" font-size="13.5" font-weight="700" fill="#0F172A">Mister Donut</text>
    </g>

    <!-- ======================================== -->
    <!-- BRAND 5: OOTOYA (COLLAPSED)              -->
    <!-- ======================================== -->
    <g id="Node-Brand-Ootoya" transform="translate(0, 400)">
      <!-- Chevron Right (>) -->
      <path d="M8 7l4 4-4 4" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <!-- Circle Avatar 'O' -->
      <g transform="translate(18, 0)">
        <circle cx="11" cy="11" r="10.5" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
        <text x="11" y="15.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2563EB">O</text>
      </g>
      <text x="48" y="16" font-size="13.5" font-weight="700" fill="#0F172A">Ootoya</text>
    </g>

    <!-- ======================================== -->
    <!-- BRAND 6: PEPPER LUNCH (COLLAPSED)        -->
    <!-- ======================================== -->
    <g id="Node-Brand-PepperLunch" transform="translate(0, 440)">
      <!-- Chevron Right (>) -->
      <path d="M8 7l4 4-4 4" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <!-- Circle Avatar 'P' -->
      <g transform="translate(18, 0)">
        <circle cx="11" cy="11" r="10.5" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
        <text x="11" y="15.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2563EB">P</text>
      </g>
      <text x="48" y="16" font-size="13.5" font-weight="700" fill="#0F172A">Pepper Lunch</text>
    </g>

  </g>
</svg>