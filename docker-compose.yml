services:
  # 1. PostgreSQL Database Service
  postgres-db:
    image: postgres:16-alpine
    container_name: satisfaction_postgres
    restart: always
    environment:
      POSTGRES_DB: satisfaction_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password_2026!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. pgAdmin (หน้าเว็บสำหรับดู Database และตาราง)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: satisfaction_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@satisfaction.com
      PGADMIN_DEFAULT_PASSWORD: Admin@123456
    ports:
      - "5050:80"
    depends_on:
      - postgres-db

volumes:
  postgres_data:
    driver: local

